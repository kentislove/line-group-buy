<svg xmlns="http://www.w3.org/2000/svg" width="200" height="200" viewBox="0 0 200 200">
  <!-- 稻穗 -->
  <g stroke="#B37A00" stroke-width="1" fill="#D4A574" opacity="0.18">
    <g transform="translate(30,30)">
      <line x1="0" y1="0" x2="0" y2="14" stroke-width="0.8"/>
      <ellipse cx="-2.5" cy="2" rx="1.5" ry="2"/>
      <ellipse cx="2.5" cy="5" rx="1.5" ry="2"/>
      <ellipse cx="-2.5" cy="8" rx="1.5" ry="2"/>
    </g>
  </g>

  <!-- 三星蔥 -->
  <g stroke="#5F7D5C" stroke-width="1.2" fill="none" opacity="0.18" stroke-linecap="round">
    <g transform="translate(130,40)">
      <path d="M 0 10 Q -2 0 -4 -8"/>
      <path d="M 0 10 Q 0 0 1 -10"/>
      <path d="M 0 10 Q 2 0 5 -6"/>
    </g>
  </g>

  <!-- 麵包 -->
  <g fill="#D4A574" stroke="#B37A00" stroke-width="0.6" opacity="0.18">
    <g transform="translate(55,110)">
      <ellipse cx="0" cy="0" rx="8" ry="5"/>
      <line x1="-5" y1="-1" x2="-3" y2="-3" stroke="#B37A00"/>
      <line x1="0" y1="-1" x2="2" y2="-3" stroke="#B37A00"/>
      <line x1="4" y1="-1" x2="6" y2="-3" stroke="#B37A00"/>
    </g>
  </g>

  <!-- 米粒 -->
  <g fill="#B37A00" opacity="0.18">
    <ellipse cx="100" cy="90" rx="1.5" ry="2.5" transform="rotate(20 100 90)"/>
    <ellipse cx="110" cy="100" rx="1.5" ry="2.5" transform="rotate(-10 110 100)"/>
    <ellipse cx="95" cy="105" rx="1.5" ry="2.5" transform="rotate(40 95 105)"/>
    <ellipse cx="170" cy="150" rx="1.5" ry="2.5" transform="rotate(-20 170 150)"/>
    <ellipse cx="180" cy="160" rx="1.5" ry="2.5" transform="rotate(30 180 160)"/>
  </g>

  <!-- 葉子 -->
  <g fill="#7A9B76" opacity="0.18">
    <g transform="translate(160,80)">
      <path d="M 0 0 Q 5 -5 10 -2 Q 8 5 0 0 Z"/>
      <line x1="0" y1="0" x2="10" y2="-2" stroke="#5F7D5C" stroke-width="0.5"/>
    </g>
    <g transform="translate(35,170)">
      <path d="M 0 0 Q 5 -5 10 -2 Q 8 5 0 0 Z"/>
    </g>
  </g>

  <!-- 蕃茄 -->
  <g fill="#E07A5F" opacity="0.2" stroke="#B37A00" stroke-width="0.5">
    <g transform="translate(140,160)">
      <circle cx="0" cy="0" r="5"/>
      <path d="M -2 -4 L 0 -6 L 2 -4" stroke="#5F7D5C" fill="none" stroke-width="0.8"/>
    </g>
  </g>
</svg>
