<!DOCTYPE html>
<html lang="zh-TW">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>農安市集112宜蘭美食市集｜線上團購系統</title>
<meta name="description" content="手機下單、分享到 LINE、後台一鍵管理 — 專為宜蘭小農市集設計">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Noto+Sans+TC:wght@400;500;600;700&family=Noto+Serif+TC:wght@500;600;700&display=swap" rel="stylesheet">
<style>
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body {
    font-family: "Noto Sans TC", -apple-system, sans-serif;
    background:
      radial-gradient(circle at 20% 10%, rgba(122,155,118,0.18), transparent 50%),
      radial-gradient(circle at 80% 90%, rgba(224,122,95,0.12), transparent 50%),
      #1a1d1c;
    color: #f0e9d9;
    min-height: 100vh;
    overflow-x: hidden;
    letter-spacing: 0.5px;
  }
  .wrap {
    max-width: 1100px;
    margin: 0 auto;
    padding: 24px 20px 60px;
  }

  /* ===== 第 1 區：手機演示（最頂部置中） ===== */
  .stage {
    display: flex; flex-direction: column; align-items: center;
    padding: 10px 0 16px;
  }

  .phone {
    width: 320px;
    height: 650px;
    background: #111;
    border-radius: 42px;
    padding: 12px 10px;
    box-shadow:
      0 0 0 2px #333,
      0 30px 60px rgba(0,0,0,0.5),
      0 0 0 1px rgba(255,255,255,0.05) inset;
    position: relative;
  }
  .phone::before {
    content: '';
    position: absolute;
    top: 20px; left: 50%;
    transform: translateX(-50%);
    width: 110px; height: 20px;
    background: #000;
    border-radius: 12px;
    z-index: 3;
  }
  .screen {
    width: 100%; height: 100%;
    border-radius: 30px;
    overflow: hidden;
    position: relative;
    background: #FBF5EC;
  }

  .slide {
    position: absolute;
    inset: 0;
    transform: translateX(100%);
    transition: transform 0.55s cubic-bezier(0.4, 0, 0.2, 1);
    will-change: transform;
  }
  .slide.active { transform: translateX(0); }
  .slide.prev { transform: translateX(-100%); }
  .slide img {
    width: 100%; height: 100%;
    object-fit: cover;
    object-position: top;
    display: block;
  }

  /* 手指指示 */
  .finger {
    position: absolute;
    width: 46px; height: 46px;
    pointer-events: none;
    z-index: 5;
    opacity: 0;
    transform: translate(-50%, -50%) scale(0.5);
    transition: transform 0.2s;
    filter: drop-shadow(0 4px 12px rgba(0,0,0,0.5));
  }
  .finger.show {
    opacity: 1;
    animation: fingerTap 1.4s ease-out;
  }
  @keyframes fingerTap {
    0%   { opacity: 0; transform: translate(-50%, -80%) scale(0.5); }
    30%  { opacity: 1; transform: translate(-50%, -50%) scale(1); }
    55%  { opacity: 1; transform: translate(-50%, -50%) scale(0.85); }
    70%  { opacity: 1; transform: translate(-50%, -50%) scale(1); }
    100% { opacity: 0; transform: translate(-50%, -50%) scale(1.1); }
  }
  /* 點擊水波紋 */
  .ripple {
    position: absolute;
    width: 70px; height: 70px;
    border: 2px solid #FFF;
    border-radius: 50%;
    pointer-events: none;
    z-index: 4;
    opacity: 0;
    transform: translate(-50%, -50%) scale(0);
  }
  .ripple.show {
    animation: rippleOut 0.9s ease-out 0.4s;
  }
  @keyframes rippleOut {
    0%   { opacity: 0.9; transform: translate(-50%, -50%) scale(0.3); }
    100% { opacity: 0; transform: translate(-50%, -50%) scale(1.6); }
  }
  /* 向上滑的手勢軌跡 */
  .swipe-track {
    position: absolute;
    width: 3px; height: 180px;
    background: linear-gradient(to top, rgba(255,255,255,0.8), rgba(255,255,255,0));
    pointer-events: none; z-index: 5;
    left: 50%; top: 70%;
    transform: translate(-50%, 0) scaleY(0);
    transform-origin: bottom center;
    opacity: 0;
  }
  .swipe-track.show {
    animation: swipeUp 1s ease-out;
  }
  @keyframes swipeUp {
    0%   { opacity: 0; transform: translate(-50%, 0) scaleY(0); }
    30%  { opacity: 1; transform: translate(-50%, 0) scaleY(1); }
    100% { opacity: 0; transform: translate(-50%, -60px) scaleY(1); }
  }

  /* ===== 第 2 區：下方旁白 ===== */
  .caption-wrap {
    max-width: 640px;
    margin: 20px auto 0;
    text-align: center;
  }
  .caption-no {
    display: inline-block;
    background: rgba(122,155,118,0.18);
    color: #a8c4a3;
    padding: 4px 14px;
    border-radius: 20px;
    font-size: 0.75rem;
    font-weight: 700;
    letter-spacing: 2px;
    margin-bottom: 12px;
  }
  .caption-title {
    font-family: "Noto Serif TC", serif;
    font-size: 1.5rem;
    font-weight: 700;
    color: #FBF5EC;
    margin-bottom: 8px;
    line-height: 1.4;
    letter-spacing: 1.5px;
  }
  .caption-desc {
    color: #d6cfbe;
    font-size: 0.95rem;
    line-height: 1.8;
    max-width: 520px;
    margin: 0 auto;
  }

  /* ===== 第 3 區：控制列 + 進度 ===== */
  .progress {
    max-width: 640px;
    margin: 24px auto 10px;
    height: 3px;
    background: rgba(255,255,255,0.08);
    border-radius: 2px;
    overflow: hidden;
  }
  .progress-bar {
    height: 100%;
    background: linear-gradient(90deg, #7A9B76, #8FAA8A);
    width: 0;
    transition: width 0.1s linear;
  }
  .controls {
    display: flex; gap: 10px; align-items: center; justify-content: center;
    flex-wrap: wrap;
    margin-top: 6px;
  }
  .ctrl-btn {
    background: rgba(255,255,255,0.08);
    color: #FBF5EC;
    border: 1px solid rgba(255,255,255,0.15);
    padding: 9px 18px;
    border-radius: 999px;
    cursor: pointer;
    font-size: 0.88rem;
    font-weight: 600;
    font-family: inherit;
    transition: all 0.15s;
  }
  .ctrl-btn:hover { background: rgba(255,255,255,0.15); }
  .ctrl-btn.primary { background: #7A9B76; border-color: #7A9B76; }
  .ctrl-btn.primary:hover { background: #8FAA8A; }
  .page-info { color: #a09888; font-size: 0.85rem; min-width: 50px; text-align: center; }

  /* ===== 第 4 區：品牌 + CTA ===== */
  .brand-block {
    max-width: 640px;
    margin: 40px auto 0;
    padding-top: 32px;
    border-top: 1px solid rgba(255,255,255,0.08);
    text-align: center;
  }
  .brand-tag {
    display: inline-block;
    background: rgba(122,155,118,0.2);
    color: #a8c4a3;
    padding: 4px 14px;
    border-radius: 20px;
    font-size: 0.75rem;
    font-weight: 600;
    letter-spacing: 1.5px;
  }
  .brand-block h1 {
    font-family: "Noto Serif TC", serif;
    font-size: 1.7rem;
    font-weight: 700;
    letter-spacing: 3px;
    margin: 12px 0 10px;
    color: #FBF5EC;
  }
  .brand-sub {
    color: #a09888;
    font-size: 0.92rem;
    line-height: 1.8;
    margin-bottom: 20px;
  }

  /* 連結盒 */
  .link-box {
    background: rgba(255,255,255,0.05);
    border: 1px solid rgba(255,255,255,0.1);
    border-radius: 14px;
    padding: 14px 18px;
    margin: 12px auto;
    max-width: 600px;
    display: grid;
    grid-template-columns: 1fr auto;
    gap: 6px 12px;
    align-items: center;
    text-align: left;
  }
  .link-label {
    grid-column: 1 / -1;
    color: #a8c4a3;
    font-size: 0.78rem;
    font-weight: 600;
    letter-spacing: 1.5px;
  }
  .link-url {
    color: #FBF5EC;
    font-family: 'Consolas', monospace;
    font-size: 0.85rem;
    word-break: break-all;
    text-decoration: none;
    padding: 4px 0;
  }
  .link-url:hover { color: #8FAA8A; text-decoration: underline; }
  .link-copy {
    background: #7A9B76;
    color: #fff;
    border: none;
    padding: 6px 14px;
    border-radius: 999px;
    font-size: 0.8rem;
    font-weight: 600;
    cursor: pointer;
    font-family: inherit;
    white-space: nowrap;
  }
  .link-copy:hover { background: #8FAA8A; }
  .link-copy.copied { background: #06C755; }
  @media (max-width: 480px) {
    .link-box { grid-template-columns: 1fr; }
    .link-url { font-size: 0.78rem; }
    .link-copy { justify-self: start; }
  }
  .cta-grid {
    display: flex; gap: 12px; justify-content: center; flex-wrap: wrap;
    margin-top: 20px;
  }
  .cta {
    display: inline-block;
    padding: 12px 26px;
    border-radius: 999px;
    text-decoration: none;
    font-weight: 700;
    font-size: 0.95rem;
    transition: all 0.15s;
  }
  .cta.primary { background: #06C755; color: #fff; }
  .cta.primary:hover { background: #04a847; }
  .cta.ghost {
    background: transparent; color: #a8c4a3;
    border: 1.5px solid #7A9B76;
  }
  .cta.ghost:hover { background: rgba(122,155,118,0.15); }
  .credit {
    color: #666; font-size: 0.75rem;
    margin-top: 20px; text-align: center;
    letter-spacing: 1px;
  }
</style>
</head>
<body>

<div class="wrap">

  <!-- 1. 手機演示（最上） -->
  <div class="stage">
    <div class="phone">
      <div class="screen" id="screen">
        <!-- 手指 / 水波紋 / 滑動軌跡 共用容器 -->
        <div class="finger" id="finger">
          <svg viewBox="0 0 48 48" xmlns="http://www.w3.org/2000/svg">
            <circle cx="24" cy="24" r="22" fill="rgba(255,255,255,0.15)" stroke="#fff" stroke-width="2"/>
            <circle cx="24" cy="24" r="10" fill="#fff" opacity="0.8"/>
          </svg>
        </div>
        <div class="ripple" id="ripple"></div>
        <div class="swipe-track" id="swipeTrack"></div>
      </div>
    </div>
  </div>

  <!-- 2. 旁白 -->
  <div class="caption-wrap">
    <div class="caption-no" id="capNo">01 / 10</div>
    <div class="caption-title" id="capTitle">載入中…</div>
    <div class="caption-desc" id="capDesc"></div>
  </div>

  <!-- 3. 控制 -->
  <div class="progress"><div class="progress-bar" id="progressBar"></div></div>
  <div class="controls">
    <button class="ctrl-btn" id="prevBtn">← 上一張</button>
    <button class="ctrl-btn primary" id="playBtn">⏸ 暫停</button>
    <button class="ctrl-btn" id="nextBtn">下一張 →</button>
    <span class="page-info" id="pageInfo">1 / 10</span>
  </div>

  <!-- 4. 品牌 + 連結 CTA -->
  <div class="brand-block">
    <span class="brand-tag">宜蘭小農市集 ・ 線上團購</span>
    <h1>農安市集112宜蘭美食市集</h1>
    <div class="brand-sub">
      客人滑一滑就下單　團購主手機就能管好一週生意<br>
      週一取貨、週日截止　代購費自動算、分享到 LINE 一鍵完成
    </div>

    <div class="link-box">
      <div class="link-label">👉 前台（給客人下單）</div>
      <a href="index.html" target="_blank" class="link-url" id="frontUrl">https://kentislove.github.io/line-group-buy/</a>
      <button class="link-copy" onclick="copyUrl('frontUrl', this)">複製</button>
    </div>
    <div class="link-box">
      <div class="link-label">🛠 後台（給團購主管理）</div>
      <a href="admin.html" target="_blank" class="link-url" id="adminUrl">https://kentislove.github.io/line-group-buy/admin.html</a>
      <button class="link-copy" onclick="copyUrl('adminUrl', this)">複製</button>
    </div>

    <div class="cta-grid">
      <a href="index.html" target="_blank" class="cta primary">👉 馬上去前台下單</a>
      <a href="admin.html" target="_blank" class="cta ghost">🛠 進後台試試</a>
      <a href="manual.html" target="_blank" class="cta ghost">📘 操作手冊</a>
    </div>

    <div class="credit">© 農安市集112宜蘭美食市集</div>
  </div>

</div>

<script>
// 每一張畫面 + 「使用者點了哪裡」的座標（screen 300x630 比例內的 %）
const slides = [
  { img: 'demo-shots/01-home.jpg', title: '一打開就看到本週團購',
    desc: '手機點 LINE 群組的連結直接進來。頂上是下單截止時間，中間是蘭陽山景＋小農市集插畫。',
    action: { type: 'tap', x: 85, y: 92 } }, // 點鮮肉餅 ＋
  { img: 'demo-shots/02-add-item.jpg', title: '點 ＋ 就能加進購物車',
    desc: '阿賢的鮮肉餅加 2 包，底部馬上算出小計 $60。免代購費的店家就直接是商品總價。',
    action: { type: 'swipe' } },
  { img: 'demo-shots/03-yishun.jpg', title: '滑到下一家｜亦順軒',
    desc: '另一家代購商家：亦順軒。右上角標著「代購費 10%」，等結帳時自動依小計加計。',
    action: { type: 'tap', x: 85, y: 50 } },
  { img: 'demo-shots/04-add-yishun.jpg', title: '跨家下單｜10% 自動算',
    desc: '再加 1 條紅酒莓果 $60。底下小計跳成 $126（60+60+亦順軒 10% 代購費）。',
    action: { type: 'tap', x: 85, y: 96 } }, // 點結帳
  { img: 'demo-shots/05-checkout.jpg', title: '結帳｜明細一目了然',
    desc: '彈出確認視窗，每一項、代購費、總計都列清楚。填暱稱和電話就能送單。',
    action: { type: 'tap', x: 78, y: 83 } }, // 點確認送出
  { img: 'demo-shots/06-success.jpg', title: '送單完成｜一鍵分享 LINE',
    desc: '下單後跳出訂單摘要，按「分享到 LINE」直接開聊天室挑收件人；或複製訂單貼給團購主。',
    action: { type: 'tap', x: 50, y: 65 } }, // 點分享LINE
  { img: 'demo-shots/07-admin-orders.jpg', title: '後台｜即時看到所有訂單',
    desc: '客人訂單依時間排列，電話、商家、品項、金額清楚。按「整筆刪除」一鍵清掉錯單。',
    action: { type: 'tap', x: 38, y: 23 } }, // 點報表 tab
  { img: 'demo-shots/08-admin-report.jpg', title: '本週報表｜列印／匯出 Excel',
    desc: '依客人分組，看得到每個人買了什麼、各自總計。可以列印給攤商、或匯出 Excel 給會計。',
    action: { type: 'tap', x: 18, y: 17 } }, // 點週期與排班 tab
  { img: 'demo-shots/09-schedule.jpg', title: '每週勾一勾就排班完成',
    desc: '週期分頁點「設定排班」→ 勾選這週出現的商家、攤位。前台只會顯示勾起來的。',
    action: { type: 'tap', x: 43, y: 17 } }, // 點代購商家 tab
  { img: 'demo-shots/10-quick-add.jpg', title: '新增商家｜5 格搞定',
    desc: '快速新增商家只問 5 樣：名稱、收不收代購費、金額、模式、照片。其他自動帶預設值。',
    action: { type: 'tap', x: 78, y: 92 } } // 點儲存
];

const screen = document.getElementById('screen');
const bar = document.getElementById('progressBar');
const capNo = document.getElementById('capNo');
const capTitle = document.getElementById('capTitle');
const capDesc = document.getElementById('capDesc');
const pageInfo = document.getElementById('pageInfo');
const finger = document.getElementById('finger');
const ripple = document.getElementById('ripple');
const swipeTrack = document.getElementById('swipeTrack');

// 建 slide 元素
const slideEls = [];
slides.forEach((s, i) => {
  const div = document.createElement('div');
  div.className = 'slide';
  div.innerHTML = `<img src="${s.img}" alt="${s.title}">`;
  screen.appendChild(div);
  slideEls.push(div);
});

let current = 0;
let playing = true;
const DURATION = 5000;   // 每張總長
const ACTION_AT = 3600;  // 動作出現時機
let startTime = Date.now();
let actionTriggered = false;

function show(i) {
  const n = slides.length;
  const prevIdx = current;
  current = ((i % n) + n) % n;
  slideEls.forEach((el, idx) => {
    el.classList.remove('active', 'prev');
    if (idx === current) el.classList.add('active');
    else if (idx === prevIdx && prevIdx !== current) el.classList.add('prev');
  });
  const s = slides[current];
  capNo.textContent = String(current + 1).padStart(2, '0') + ' / ' + String(n).padStart(2, '0');
  capTitle.textContent = s.title;
  capDesc.textContent = s.desc;
  pageInfo.textContent = (current + 1) + ' / ' + n;
  startTime = Date.now();
  actionTriggered = false;
  // 重置手勢元素
  finger.classList.remove('show');
  ripple.classList.remove('show');
  swipeTrack.classList.remove('show');
}

function playAction() {
  const s = slides[current];
  const a = s.action;
  if (!a) return;
  if (a.type === 'tap') {
    finger.style.left = a.x + '%';
    finger.style.top = a.y + '%';
    ripple.style.left = a.x + '%';
    ripple.style.top = a.y + '%';
    // reset first
    finger.classList.remove('show');
    ripple.classList.remove('show');
    void finger.offsetWidth;
    void ripple.offsetWidth;
    finger.classList.add('show');
    ripple.classList.add('show');
  } else if (a.type === 'swipe') {
    swipeTrack.classList.remove('show');
    void swipeTrack.offsetWidth;
    swipeTrack.classList.add('show');
  }
}

function tick() {
  if (playing) {
    const elapsed = Date.now() - startTime;
    const pct = Math.min(100, (elapsed / DURATION) * 100);
    bar.style.width = pct + '%';
    if (!actionTriggered && elapsed >= ACTION_AT) {
      actionTriggered = true;
      playAction();
    }
    if (elapsed >= DURATION) show(current + 1);
  }
  requestAnimationFrame(tick);
}

document.getElementById('prevBtn').onclick = () => show(current - 1);
document.getElementById('nextBtn').onclick = () => show(current + 1);
document.getElementById('playBtn').onclick = (e) => {
  playing = !playing;
  e.target.textContent = playing ? '⏸ 暫停' : '▶ 播放';
  if (playing) startTime = Date.now() - (parseFloat(bar.style.width) / 100 * DURATION);
};
document.addEventListener('keydown', (e) => {
  if (e.key === 'ArrowLeft') show(current - 1);
  else if (e.key === 'ArrowRight') show(current + 1);
  else if (e.key === ' ') { e.preventDefault(); document.getElementById('playBtn').click(); }
});

show(0);
tick();

async function copyUrl(id, btn) {
  const url = document.getElementById(id).href;
  try { await navigator.clipboard.writeText(url); }
  catch (e) {
    const t = document.createElement('textarea');
    t.value = url; document.body.appendChild(t); t.select();
    document.execCommand('copy'); t.remove();
  }
  const orig = btn.textContent;
  btn.textContent = '已複製';
  btn.classList.add('copied');
  setTimeout(() => { btn.textContent = orig; btn.classList.remove('copied'); }, 1500);
}
</script>
</body>
</html>
